<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>連絡管理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>連絡管理</h2>
        
        <p>生徒メニューの「連絡機能」に表示するメッセージをここで登録・管理します。</p>
        
        <form id="contact-form">
            <input type="text" id="contact-title" placeholder="タイトル (例: 期末試験について)" style="width: 100%; margin-bottom: 10px;" required>
            
            <textarea id="contact-message" placeholder="連絡内容を入力してください" rows="8" style="width: 100%; resize: vertical; margin-bottom: 15px;" required></textarea>
            
            <button type="button" onclick="sendContact()">連絡事項の登録/送信 (シミュレーション)</button>
        </form>
        
        <p id="contact-result" style="margin-top: 20px; font-weight: bold;"></p>

        <br>
        <button onclick="navigateTo('admin_menu.html')">メニューに戻る</button>
    </div>
    <script src="js/app.js"></script>
    <script src="js/admin_contact.js"></script> </body>
</html>
